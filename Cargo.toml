# tpt-weave workspace (spec.md section 25: one repository, many crates).
[workspace]
resolver = "2"
members = [
    "crates/tpt-weave-core",
    "crates/tpt-weave-index",
    "crates/tpt-weave-rust",
    "crates/tpt-weave-graph",
    "crates/tpt-weave-context",
    "crates/tpt-weave-tools",
    "crates/tpt-weave-cache",
    "crates/tpt-weave-decisions",
    "crates/tpt-weave-openrouter",
    "crates/tpt-weave-mcp",
    "crates/tpt-weave-cli",
    "crates/tpt-weave-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["TPT Solutions"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
tpt-weave-core = { path = "crates/tpt-weave-core" }
tpt-weave-index = { path = "crates/tpt-weave-index" }
tpt-weave-rust = { path = "crates/tpt-weave-rust" }
tpt-weave-graph = { path = "crates/tpt-weave-graph" }
tpt-weave-context = { path = "crates/tpt-weave-context" }
tpt-weave-tools = { path = "crates/tpt-weave-tools" }
tpt-weave-cache = { path = "crates/tpt-weave-cache" }
tpt-weave-decisions = { path = "crates/tpt-weave-decisions" }
tpt-weave-openrouter = { path = "crates/tpt-weave-openrouter" }
tpt-weave-mcp = { path = "crates/tpt-weave-mcp" }
tpt-weave-cli = { path = "crates/tpt-weave-cli" }
tpt-weave-eval = { path = "crates/tpt-weave-eval" }
rmcp = { version = "3.4", default-features = false, features = [
    "server",
    "transport-io",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }


