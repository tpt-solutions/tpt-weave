# tpt-weave workspace (spec.md section 25: one repository, many crates).
[workspace]
resolver = "2"
members = ["crates/tpt-weave-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["TPT Solutions"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
