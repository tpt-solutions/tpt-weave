# tpt-weave workspace (spec.md section 25: one repository, many crates).
[workspace]
resolver = "2"
members = [
    "crates/tpt-weave-core",
    "crates/tpt-weave-index",
    "crates/tpt-weave-rust",
    "crates/tpt-weave-graph",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["TPT Solutions"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
tpt-weave-core = { path = "crates/tpt-weave-core" }
tpt-weave-index = { path = "crates/tpt-weave-index" }
tpt-weave-rust = { path = "crates/tpt-weave-rust" }
tpt-weave-graph = { path = "crates/tpt-weave-graph" }


